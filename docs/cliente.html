<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Acompanhamento do serviço</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/icone-180.png">
  <script type="importmap">
  {
    "imports": {
      "./config.js": "./config.js?v=202611270041",
      "./js/app.js": "./js/app.js?v=202611270041",
      "./js/base.js": "./js/base.js?v=202611270041",
      "./js/paginas/busca.js": "./js/paginas/busca.js?v=202611270041",
      "./js/paginas/cadastros.js": "./js/paginas/cadastros.js?v=202611270041",
      "./js/paginas/clientes.js": "./js/paginas/clientes.js?v=202611270041",
      "./js/paginas/cronograma.js": "./js/paginas/cronograma.js?v=202611270041",
      "./js/paginas/financeiro.js": "./js/paginas/financeiro.js?v=202611270041",
      "./js/paginas/fornecedores.js": "./js/paginas/fornecedores.js?v=202611270041",
      "./js/paginas/os.js": "./js/paginas/os.js?v=202611270041",
      "./js/paginas/painel.js": "./js/paginas/painel.js?v=202611270041",
      "./js/paginas/prazos.js": "./js/paginas/prazos.js?v=202611270041",
      "./js/paginas/propostas.js": "./js/paginas/propostas.js?v=202611270041",
      "./js/paginas/tarefas.js": "./js/paginas/tarefas.js?v=202611270041"
    }
  }
  </script>
  <link rel="stylesheet" href="css/estilo.css?v=202611270041">
  <style>
    .rel { max-width: 960px; margin: 0 auto; padding: 1.25rem; }
    .rel-topo { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; border-bottom: 3px solid var(--marca); padding-bottom: .75rem; margin-bottom: 1rem; }
    .rel-topo .marca { color: var(--marca); }
    .rel-topo .marca-logo { height: 46px; }
    .rel-topo .marca-nome { border-left: 1px solid var(--linha); padding-left: .7rem; }
    .rel h1 { margin: .25rem 0; }
    .rodape { color: var(--suave); font-size: .82rem; text-align: center; margin: 2rem 0 1rem; }
    /* textos longos quebram linha: sem rolagem lateral e sem corte na impressão */
    .rel .tabela { width: 100%; }
    .rel .tabela th { white-space: normal; }
    .rel .tabela td.texto { min-width: 8rem; overflow-wrap: anywhere; }
    @media (max-width: 900px) { .rel .tabela td.texto { min-width: 0; } }
    @media print {
      .rel { max-width: none; padding: 0; }
      .rel .tabela-rolagem { overflow: visible; }
      .rel .tabela { font-size: .8rem; }
      .rel .tabela td, .rel .tabela th { padding: .3rem .35rem; }
      .rel .tabela td.texto { min-width: 0; }
      .rel .secao { break-inside: auto; }
      .rel .tabela tr { break-inside: avoid; }
    }
  </style>
  <script src="vendor/supabase-2.118.0.js"></script>
</head>
<body>
  <div class="rel" id="rel"><p class="carregando">Carregando relatório…</p></div>
  <script type="module">
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
    const raiz = document.getElementById('rel');

    function h(tag, attrs, ...filhos) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) if (v != null) k === 'class' ? el.className = v : k.startsWith('on') ? el.addEventListener(k.slice(2), v) : el.setAttribute(k, v);
      for (const f of filhos.flat(Infinity)) if (f != null && f !== false && f !== '') el.append(f instanceof Node ? f : document.createTextNode(String(f)));
      return el;
    }
    const data = (d) => d ? new Date(d.length === 10 ? d + 'T12:00:00' : d).toLocaleDateString('pt-BR') : '';
    const reais = (v) => v == null ? '' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const COR = { 'Pendente': 'amarelo', 'Ativa': 'verde', 'Emitida': 'verde', 'Baixada': 'cinza', 'Em andamento': 'azul', 'Ativo': 'azul', 'Em aberto': 'amarelo', 'Paralisado': 'laranja', 'Finalizado': 'verde', 'Encerrado': 'verde',
      'Concluído': 'verde', 'Pago': 'verde', 'Não iniciado': 'cinza', 'Cancelado': 'cinza', 'Nota fiscal emitida': 'roxo', 'Pendência': 'laranja', 'Não atendido': 'cinza', 'Concluída': 'verde', 'Não iniciada': 'cinza', 'A vencer': 'amarelo', 'Vencido': 'vermelho', 'Atendido': 'verde', 'Atendido fora do prazo': 'laranja', 'Triunfo': 'azul', 'Cliente': 'laranja' };
    const etq = (t) => t ? h('span', { class: 'etq ' + (COR[t] || 'cinza') }, t) : '';
    const tabela = (cols, linhas, vazio) => !linhas.length ? h('p', { class: 'vazio' }, vazio) :
      h('div', { class: 'tabela-rolagem' }, h('table', { class: 'tabela' }, h('thead', {}, h('tr', {}, cols.map(([r]) => h('th', {}, r)))),
        h('tbody', {}, linhas.map((l) => h('tr', {}, cols.map(([r, f, c]) => h('td', { 'data-rotulo': r, class: c }, f(l))))))));
    const secao = (t, ...c) => h('section', { class: 'secao' }, h('div', { class: 'secao-topo' }, h('h3', {}, t)), c);

    async function iniciar() {
      const token = new URLSearchParams(location.search).get('t');
      if (!token) { raiz.replaceChildren(h('div', { class: 'alerta erro' }, 'Link incompleto. Confira o endereço recebido.')); return; }
      const { data: r, error } = await sb.rpc('relatorio_cliente', { p_token: token });
      if (error || !r || r.erro) { raiz.replaceChildren(h('div', { class: 'alerta erro' }, (r && r.erro) || 'Não foi possível carregar o relatório.')); return; }
      const o = r.os;
      document.title = `OS ${o.numero || ''} — acompanhamento`;
      const totais = r.financeiro.reduce((a, p) => { a.t += Number(p.valor); if (p.situacao === 'Pago') a.p += Number(p.valor); return a; }, { t: 0, p: 0 });
      raiz.replaceChildren(...[
        h('div', { class: 'rel-topo' }, h('div', { class: 'marca' }, h('img', { class: 'marca-logo', src: 'img/logo-triunfo-verde.png', alt: 'Triunfo Engenharia Ambiental' }), h('span', { class: 'marca-nome' }, 'Acompanhamento do serviço')),
          h('button', { class: 'btn pequeno', onclick: () => print() }, 'Imprimir / salvar PDF')),
        h('p', { class: 'cliente-linha' }, o.cliente),
        h('h1', {}, `OS ${o.numero || ''}`), h('p', { class: 'subtitulo' }, o.titulo),
        h('div', { class: 'situacoes', style: 'margin:.75rem 0 1rem' },
          h('div', {}, h('small', {}, 'Serviço técnico'), etq(o.sit_tecnica)),
          h('div', {}, h('small', {}, 'Financeiro'), etq(o.sit_comercial)),
          h('div', {}, h('small', {}, 'Contrato'), etq(o.sit_contrato)),
          o.sit_tecnica_detalhe ? h('div', {}, h('small', {}, 'Detalhe'), o.sit_tecnica_detalhe) : null),
        secao('Dados do serviço', h('dl', { class: 'detalhes' },
          [['Proposta', o.proposta], ['Responsável técnico', o.responsavel], ['Aceite', data(o.data_aceite)], ['Prazo contratual', o.prazo_contratual],
           ['Término', data(o.data_termino)], ['Local', o.local], ['Endereço', o.local_endereco], ['Município', [o.municipio, o.uf].filter(Boolean).join(' / ')],
           ['Situação atualizada em', data(o.atualizado)]]
            .filter(([, v]) => v).map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]))),
        r.escopo.length ? secao('Escopo', h('ol', { class: 'escopo' }, r.escopo.map((e) => h('li', {}, h('strong', {}, e.servico || ''), e.descricao ? h('p', { class: 'pre' }, e.descricao) : null)))) : null,
        secao('Cronograma',
          (r.cronograma || []).some((p) => p.responsavel === 'Cliente') ? h('p', { class: 'ajuda' }, 'Na coluna "Responsável", as atividades marcadas como ', etq('Cliente'), ' dependem de uma ação sua para o serviço seguir.') : null,
          tabela([['Atividade', (p) => p.descricao, 'texto'], ['Responsável', (p) => etq(p.responsavel)], ['Início', (p) => data(p.inicio)], ['Término', (p) => data(p.termino)], ['Situação', (p) => etq(p.situacao)]], r.cronograma || [], 'Nenhuma atividade cadastrada.')),
        (r.prazos || []).length ? secao('Prazos', tabela([['Data', (p) => data(p.data)], ['Descrição', (p) => p.descricao, 'texto'], ['Tipo', (p) => p.tipo || ''], ['Origem', (p) => p.origem || ''], ['Situação', (p) => etq(p.situacao)], ['Atendido em', (p) => data(p.atendimento)]], r.prazos, '')) : null,
        secao('Andamento', r.andamento.length ? h('ul', { class: 'linha-tempo' }, r.andamento.map((m) => h('li', {}, h('div', { class: 'lt-data' }, data(m.data)),
          h('div', { class: 'lt-corpo' }, m.detalhe ? h('strong', {}, m.detalhe) : null, h('p', { class: 'pre' }, m.descricao))))) : h('p', { class: 'vazio' }, 'Nenhum registro de andamento divulgado ainda.')),
        secao('Documentos e processos', tabela([['Tipo', (p) => p.natureza || ''], ['Origem', (p) => p.instituicao || ''], ['Número', (p) => p.referencia || ''], ['Assunto', (p) => p.objetivo || '', 'texto'],
          ['Verificado em', (p) => data(p.verificado_em)], ['Situação', (p) => etq(p.status)], ['Detalhamento da situação', (p) => h('span', { class: 'pre' }, p.situacao || ''), 'texto']], r.processos, 'Nenhum documento ou processo vinculado.')),
        secao('Financeiro',
          r.financeiro.length ? h('p', {}, `Total: ${reais(totais.t)} · Pago: ${reais(totais.p)} · A pagar: ${reais(totais.t - totais.p)}`) : null,
          tabela([['Parcela', (p) => p.parcela || ''], ['Referência', (p) => p.referencia || '', 'texto'], ['Valor', (p) => reais(p.valor), 'num'], ['Previsão', (p) => data(p.prevista)], ['Pagamento', (p) => data(p.paga)], ['Situação', (p) => etq(p.situacao)]], r.financeiro, 'Nenhuma parcela cadastrada.')),
        r.produtos.length ? secao('Produtos técnicos', tabela([['Tipo', (p) => p.tipo || ''], ['Número', (p) => p.numero || ''], ['Título', (p) => p.nome, 'texto'], ['Data', (p) => data(p.data || p.enviado_em)]], r.produtos, '')) : null,
        h('p', { class: 'rodape' }, `Relatório gerado em ${new Date().toLocaleString('pt-BR')}. Em caso de dúvidas, fale com o responsável técnico.`)].filter(Boolean));
    }
    iniciar();
  </script>
</body>
</html>
